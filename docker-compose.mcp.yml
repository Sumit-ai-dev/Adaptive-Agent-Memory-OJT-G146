# ==============================================================================
# Standalone Docker Compose for AEMA MCP Server (MemPalace-style deployment)
# Runs the Model Context Protocol server over stdio for Claude Desktop & Cursor
# ==============================================================================

services:
  aema-mcp:
    build:
      context: ./packages/aema
      dockerfile: Dockerfile
    image: aema/mcp:0.1.0
    container_name: aema-mcp-server
    environment:
      - NODE_ENV=production
      - AEMA_API_URL=${AEMA_API_URL:-http://localhost:8000}
    restart: unless-stopped
    stdin_open: true
    tty: false
    volumes:
      - aema_mcp_data:/app/data

volumes:
  aema_mcp_data:
    driver: local
