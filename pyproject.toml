[project]
name = "aema"
version = "0.1.1"
description = "Adaptive Experience Memory Agent — reliability-aware experiential memory with trust scoring."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Sumit Das", email = "sumitds2005@gmail.com"},
    {name = "Kasat Sakshi Dattaprasad", email = "sakshisamu1809@gmail.com"},
]
keywords = ["ai", "memory", "agent", "trust", "langgraph", "pgvector", "negative-transfer", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "typing-extensions>=4.12.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.2.0",
    "openai>=1.40.0",
    "ddgs>=9.0.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "langgraph>=0.2.0",
    "openai>=1.40.0",
    "ddgs>=9.0.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",
    "scipy>=1.11.0",
]
full = [
    "aema[agent,server,embeddings]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/Sumit-ai-dev/Adaptive-Agent-Memory-OJT-G146"
Repository = "https://github.com/Sumit-ai-dev/Adaptive-Agent-Memory-OJT-G146"

# ── CLI entry point ──────────────────────────────────────────────────────────
# After `pip install aema` or `pip install -e .`, typing `aema` calls aema/cli.py:main()
[project.scripts]
aema = "aema.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aema"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
include = [
    "aema/**",
    "models/**",
    "ai-service/**",
    "backend/*.py",
    "backend/app/**",
    "backend/routes/**",
    "backend/requirements.txt",
    "backend/schema.sql",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]
exclude = ["backend/venv/**", "**/__pycache__/**", "*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["ai_service", "models"]

[tool.coverage.report]
show_missing = true
