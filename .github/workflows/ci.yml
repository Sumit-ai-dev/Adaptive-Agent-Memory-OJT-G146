name: CI / Automated Tests

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  test-backend:
    name: Run Pytest & Algorithmic Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache HuggingFace models
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          # Install everything except sentence-transformers (pulls in torch ~2 GB).
          # The LocalEmbedder falls back to a deterministic hash embedder when
          # sentence-transformers is absent, so all tests pass without it.
          grep -v 'sentence-transformers' backend/requirements.txt > /tmp/req_core.txt
          pip install -r /tmp/req_core.txt
          pip install -r requirements-dev.txt

      - name: Install sentence-transformers (best-effort, non-blocking)
        run: pip install 'sentence-transformers>=3.0.0'
        continue-on-error: true

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          # When sentence-transformers is absent the hash embedder produces ~0.15-0.32
          # cosine similarity. Lower the retrieval gate so tests that seed a
          # matching memory can actually retrieve it. Production config is unchanged.
          SIMILARITY_THRESHOLD: "0.10"

  test-sdk:
    name: Build & Test AEMA TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20

      - name: Install SDK dependencies
        run: |
          cd packages/aema
          npm install

      - name: Run AEMA SDK Test Suite
        run: |
          cd packages/aema
          npm test
