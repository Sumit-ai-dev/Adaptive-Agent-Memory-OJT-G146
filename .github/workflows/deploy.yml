name: CD / Deploy to Vultr

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions: read-all

jobs:
  deploy:
    name: Deploy to Vultr Cloud VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: root
          password: ${{ secrets.VULTR_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "==> [AEMA CI/CD] Pulling latest main branch on Vultr VPS..."
            cd /opt/aema
            git fetch origin main
            git reset --hard origin/main

            # Read Supabase keys from GitHub Secrets or fallback to local frontend/.env on the host
            SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
            SUPABASE_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            if [ -f /opt/aema/frontend/.env ]; then
              [ -z "$SUPABASE_URL" ] && SUPABASE_URL=$(grep "^VITE_SUPABASE_URL=" /opt/aema/frontend/.env | cut -d '=' -f2-)
              [ -z "$SUPABASE_KEY" ] && SUPABASE_KEY=$(grep "^VITE_SUPABASE_ANON_KEY=" /opt/aema/frontend/.env | cut -d '=' -f2-)
            fi

            echo "==> [AEMA CI/CD] Building standalone unified production container..."
            docker build \
              --build-arg VITE_SUPABASE_URL="$SUPABASE_URL" \
              --build-arg VITE_SUPABASE_ANON_KEY="$SUPABASE_KEY" \
              -f Dockerfile.standalone -t aema:latest .

            echo "==> [AEMA CI/CD] Restarting aema-app container..."
            docker stop aema-app || true
            docker rm aema-app || true

            # Pass runtime environment variables if host .env exists
            ENV_FLAG=""
            if [ -f /opt/aema/.env ]; then
              ENV_FLAG="--env-file /opt/aema/.env"
            fi

            docker run -d --name aema-app --restart unless-stopped \
              $ENV_FLAG \
              -p 127.0.0.1:8080:80 \
              -v aema_data:/data \
              aema:latest

            echo "==> [AEMA CI/CD] Verifying local health endpoint..."
            sleep 5
            curl -fsS http://127.0.0.1:8080/api/health || curl -fsS http://127.0.0.1/api/health || exit 1
            echo "==> [AEMA CI/CD] Deployment successfully verified and healthy!"
