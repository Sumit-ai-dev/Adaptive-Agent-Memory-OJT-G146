name: OpenSSF Scorecard Supply-Chain Security

on:
  # For Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  schedule:
    - cron: '0 4 * * 1' # Weekly on Monday at 04:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard security analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the GitHub Code Scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge on OpenSSF Scorecard REST API.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard Analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1210abd350ca88 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: SARIF results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          sarif_file: results.sarif

