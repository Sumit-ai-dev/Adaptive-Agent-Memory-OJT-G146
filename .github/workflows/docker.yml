name: Docker / Container CI

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'packages/aema/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'packages/aema/**'
      - '.github/workflows/docker.yml'

permissions: read-all

jobs:
  docker-build-and-smoke-test:
    name: Build Images & Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.mcp.yml config --quiet

      - name: Build Backend Container
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: aema/server:0.1.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Container
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aema/frontend:0.1.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MCP Server Container
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./packages/aema
          file: ./packages/aema/Dockerfile
          push: false
          tags: aema/mcp:0.1.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Full-Stack Compose Smoke Test
        run: |
          # Start PostgreSQL + pgvector and wait for health
          docker compose up -d db
          timeout 60 bash -c 'until docker compose ps db | grep -q "healthy"; do sleep 2; done'

          # Start Backend against containerized pgvector
          docker compose up -d backend
          timeout 90 bash -c 'until docker compose ps backend | grep -q "healthy"; do sleep 2; done'

          # Verify backend health endpoint
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/api/v1/health

          # Teardown
          docker compose down -v
